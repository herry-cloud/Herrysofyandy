<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SEIMBANG · Dasar-Dasar Akuntansi</title>
<meta name="description" content="Media pembelajaran interaktif Dasar-Dasar Akuntansi kelas X SMK: prinsip dan konsep akuntansi dasar.">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=Bricolage+Grotesque:opsz,wght@12..96,600..800&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
/* Layout: aplikasi HP satu kolom di atas kertas buku besar bergaris hijau; header lengket, navigasi bawah, kartu nota untuk transaksi. */
:root {
  --bg: #F2F6F3;
  --rule: #E1ECE4;
  --surface: #FFFFFF;
  --surface-2: #EDF3EF;
  --line: #D2DFD6;
  --ink: #142447;
  --ink-2: #4A5978;
  --ink-3: #7A87A0;
  --brand: #1C3D8F;
  --brand-ink: #FFFFFF;
  --brand-soft: #E2E9FA;
  --hi: #FFD23F;
  --hi-ink: #3A2E00;
  --hi-soft: #FFF4C7;
  --plus: #13784A;
  --plus-soft: #DCF2E5;
  --minus: #BE2F3A;
  --minus-soft: #FBE4E5;
  --warn: #9A5B00;
  --warn-soft: #FFEFD3;
  --nota: #FFFEF8;
  --shadow: 0 1px 0 rgba(20, 36, 71, .05), 0 10px 24px -16px rgba(20, 36, 71, .35);
  --f-display: 'Bricolage Grotesque', 'Segoe UI', system-ui, sans-serif;
  --f-body: 'Atkinson Hyperlegible', 'Segoe UI', system-ui, -apple-system, sans-serif;
  --f-num: 'IBM Plex Mono', ui-monospace, 'SFMono-Regular', Menlo, Consolas, monospace;
  --r: 14px;
  --r-sm: 10px;
  --nav-h: 64px;
  --p0: #E5484D; --p1: #3E63DD; --p2: #2B9A4A; --p3: #D6409F;
  --gA: #F76B15; --gB: #0E9AA7; --gC: #8E4EC6; --gD: #B08A2E;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0C1412; --rule: #13201C; --surface: #13201C; --surface-2: #192824; --line: #263A34;
    --ink: #E6EEE9; --ink-2: #AEBDB6; --ink-3: #7E9089; --brand: #93B0FF; --brand-ink: #0A1430; --brand-soft: #1B2A4B;
    --hi: #FFD84D; --hi-ink: #2B2200; --hi-soft: #3A3216; --plus: #4CCB92; --plus-soft: #123328; --minus: #FF7D86; --minus-soft: #3C1A1E;
    --warn: #FFB547; --warn-soft: #382910; --nota: #1B2925; --shadow: 0 1px 0 rgba(0, 0, 0, .3), 0 10px 24px -14px rgba(0, 0, 0, .7);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0C1412; --rule: #13201C; --surface: #13201C; --surface-2: #192824; --line: #263A34;
  --ink: #E6EEE9; --ink-2: #AEBDB6; --ink-3: #7E9089; --brand: #93B0FF; --brand-ink: #0A1430; --brand-soft: #1B2A4B;
  --hi: #FFD84D; --hi-ink: #2B2200; --hi-soft: #3A3216; --plus: #4CCB92; --plus-soft: #123328; --minus: #FF7D86; --minus-soft: #3C1A1E;
  --warn: #FFB547; --warn-soft: #382910; --nota: #1B2925; --shadow: 0 1px 0 rgba(0, 0, 0, .3), 0 10px 24px -14px rgba(0, 0, 0, .7);
  color-scheme: dark;
}
:root[data-huruf="besar"] { font-size: 112.5%; }

* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { min-height: 100%; }
html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; touch-action: manipulation; }
body {
  margin: 0; background: var(--bg); color: var(--ink);
  font: 400 1rem/1.55 var(--f-body);
  background-image: linear-gradient(var(--rule) 1px, transparent 1px);
  background-size: 100% 30px;
  -webkit-tap-highlight-color: transparent;
  text-rendering: optimizeLegibility;
}
button, input, textarea, select { font: inherit; color: inherit; }
button { cursor: pointer; }
a { color: var(--brand); }
:focus-visible { outline: 3px solid var(--hi); outline-offset: 2px; border-radius: 6px; }
h1, h2, h3, h4 { font-family: var(--f-display); line-height: 1.15; margin: 0; text-wrap: balance; letter-spacing: -.01em; }
p { margin: 0 0 .8em; }
.num { font-family: var(--f-num); font-variant-numeric: tabular-nums; }
.muted { color: var(--ink-2); }
.small { font-size: .875rem; }
.tiny { font-size: .78rem; }
.eyebrow { font-size: .74rem; letter-spacing: .09em; text-transform: uppercase; font-weight: 700; color: var(--ink-3); }
.ic { width: 1.25em; height: 1.25em; flex: none; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; vertical-align: -.25em; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

/* ---------- kerangka ---------- */
#app { min-height: 100vh; overflow-x: clip; }
.wrap { width: 100%; max-width: 760px; margin: 0 auto; padding-inline: 16px; }
.wrap.wide { max-width: 1180px; }
.page { padding-block: 18px calc(var(--nav-h) + 32px + env(safe-area-inset-bottom, 0px)); display: grid; gap: 16px; }
.page.no-nav { padding-bottom: 40px; }
.topbar {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 30;
  background: color-mix(in srgb, var(--surface) 92%, transparent);
  backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
  border-bottom: 1px solid var(--line);
}
.topbar .brandrow { display: flex; align-items: center; gap: 10px; min-height: 54px; }
.brand { display: flex; align-items: center; gap: 9px; text-decoration: none; color: var(--ink); background: none; border: 0; padding: 0; text-align: left; min-width: 0; }
.brand > span { min-width: 0; }
.brand b { font-family: var(--f-display); font-weight: 800; font-size: 1.12rem; letter-spacing: .04em; }
.brand small { display: block; font-size: .68rem; color: var(--ink-3); letter-spacing: .02em; margin-top: -2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.logo { width: 34px; height: 34px; flex: none; }
.topbar .sp { flex: 1; }
.iconbtn {
  width: 40px; height: 40px; border-radius: 12px; border: 1px solid var(--line); background: var(--surface);
  display: inline-grid; place-items: center; color: var(--ink-2);
}
.iconbtn:hover { color: var(--ink); border-color: var(--ink-3); }
.xpchip {
  display: inline-flex; align-items: center; gap: 6px; padding: 6px 10px 6px 8px; border-radius: 999px;
  background: var(--hi-soft); color: var(--ink); font-weight: 700; font-size: .85rem; border: 1px solid color-mix(in srgb, var(--hi) 60%, transparent);
}
.xpchip .ic { color: var(--warn); }
.syncdot { width: 9px; height: 9px; border-radius: 50%; background: var(--plus); display: inline-block; }
.syncdot.busy { background: var(--hi); animation: pulse 1s infinite; }
.syncdot.off { background: var(--minus); }
@keyframes pulse { 50% { opacity: .35; } }

.navbar {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 40;
  background: var(--surface); border-top: 1px solid var(--line);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
.navbar .wrap { display: grid; grid-template-columns: repeat(5, 1fr); height: var(--nav-h); padding-inline: 6px; }
.navbar button {
  border: 0; background: none; color: var(--ink-3); display: grid; justify-items: center; align-content: center; gap: 3px;
  font-size: .72rem; font-weight: 700; position: relative;
}
.navbar button .ic { width: 24px; height: 24px; }
.navbar button[aria-current="page"] { color: var(--brand); }
.navbar button[aria-current="page"]::before {
  content: ""; position: absolute; top: 0; left: 28%; right: 28%; height: 3px; border-radius: 0 0 3px 3px; background: var(--hi);
}
.navbar .dot { position: absolute; top: 9px; right: calc(50% - 18px); width: 8px; height: 8px; border-radius: 50%; background: var(--minus); }

.tabs { display: flex; gap: 4px; overflow-x: auto; scrollbar-width: none; padding-bottom: 2px; }
.tabs::-webkit-scrollbar { display: none; }
.tabs button {
  flex: none; border: 0; background: none; padding: 12px 12px 10px; font-weight: 700; color: var(--ink-3);
  border-bottom: 3px solid transparent; display: inline-flex; gap: 6px; align-items: center; white-space: nowrap;
}
.tabs button[aria-current="page"] { color: var(--ink); border-color: var(--brand); }
.tabs .count { background: var(--minus); color: #fff; border-radius: 999px; font-size: .7rem; padding: 1px 6px; }

/* ---------- komponen ---------- */
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 16px; box-shadow: var(--shadow); min-width: 0; }
.card.flat { box-shadow: none; }
.card.tint { background: var(--surface-2); box-shadow: none; }
.card h2 { font-size: 1.2rem; }
.card h3 { font-size: 1.05rem; }
.row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.row.between { justify-content: space-between; }
.row.nowrap { flex-wrap: nowrap; }
.stack { display: grid; gap: 10px; align-content: start; }
.stack > *, .card > *, .bacaan { min-width: 0; }
.stack.lg { gap: 16px; }
.grid2 { display: grid; gap: 12px; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); }
.grid3 { display: grid; gap: 12px; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); }
.sec-title { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; }
.sec-title h2 { font-size: 1.15rem; }

.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  min-height: 48px; padding: 10px 18px; border-radius: 12px; border: 1px solid transparent;
  background: var(--brand); color: var(--brand-ink); font-weight: 700; text-decoration: none; text-align: center;
  transition: transform .08s ease, filter .15s;
}
.btn:hover { filter: brightness(1.06); }
.btn:active { transform: translateY(1px) scale(.99); }
.btn[disabled] { opacity: .5; pointer-events: none; }
.btn.sec { background: var(--surface); color: var(--ink); border-color: var(--line); }
.btn.ghost { background: transparent; color: var(--brand); border-color: transparent; }
.btn.hi { background: var(--hi); color: var(--hi-ink); }
.btn.danger { background: var(--minus); color: #fff; }
.btn.sm { min-height: 38px; padding: 6px 12px; font-size: .9rem; border-radius: 10px; }
.btn.block { width: 100%; }
.btn .ic { width: 1.2em; height: 1.2em; }

.pill { display: inline-flex; align-items: center; gap: 5px; border-radius: 999px; padding: 3px 10px; font-size: .78rem; font-weight: 700; background: var(--surface-2); color: var(--ink-2); white-space: nowrap; }
.pill.ok { background: var(--plus-soft); color: var(--plus); }
.pill.bad { background: var(--minus-soft); color: var(--minus); }
.pill.warn { background: var(--warn-soft); color: var(--warn); }
.pill.info { background: var(--brand-soft); color: var(--brand); }
.pill.hi { background: var(--hi-soft); color: var(--ink); }

.bar { height: 10px; border-radius: 99px; background: var(--surface-2); overflow: hidden; border: 1px solid var(--line); }
.bar > i { display: block; height: 100%; background: var(--brand); border-radius: 99px; transition: width .6s cubic-bezier(.2, .8, .2, 1); }
.bar.xp > i { background: linear-gradient(90deg, var(--hi), color-mix(in srgb, var(--hi) 70%, var(--warn))); }
.bar.ok > i { background: var(--plus); }

.field { display: grid; gap: 6px; }
.field label { font-weight: 700; font-size: .92rem; }
.field .hint { font-size: .8rem; color: var(--ink-3); }
.input, textarea.input, select.input {
  width: 100%; min-height: 48px; padding: 11px 14px; border-radius: 12px; border: 1.5px solid var(--line);
  background: var(--surface); color: var(--ink);
}
textarea.input { min-height: 96px; resize: vertical; line-height: 1.5; }
.input:focus { outline: none; border-color: var(--brand); box-shadow: 0 0 0 3px var(--brand-soft); }
.pw { position: relative; }
.pw .iconbtn { position: absolute; right: 4px; top: 4px; border: 0; background: none; }

.switch { display: flex; align-items: center; justify-content: space-between; gap: 14px; padding: 12px 0; border-bottom: 1px dashed var(--line); }
.switch:last-child { border-bottom: 0; }
.switch b { display: block; font-size: .95rem; }
.switch span { font-size: .82rem; color: var(--ink-3); }
.tog { position: relative; width: 52px; height: 30px; flex: none; }
.tog input { position: absolute; inset: 0; opacity: 0; margin: 0; cursor: pointer; z-index: 1; }
.tog i { position: absolute; inset: 0; border-radius: 99px; background: var(--line); transition: background .2s; }
.tog i::after { content: ""; position: absolute; top: 3px; left: 3px; width: 24px; height: 24px; border-radius: 50%; background: #fff; box-shadow: 0 1px 3px rgba(0, 0, 0, .3); transition: transform .2s; }
.tog input:checked + i { background: var(--plus); }
.tog input:checked + i::after { transform: translateX(22px); }
.tog input:focus-visible + i { outline: 3px solid var(--hi); outline-offset: 2px; }

.notice { display: flex; gap: 12px; align-items: flex-start; padding: 12px 14px; border-radius: 12px; background: var(--brand-soft); color: var(--ink); border: 1px solid color-mix(in srgb, var(--brand) 25%, transparent); }
.notice.hi { background: var(--hi-soft); border-color: color-mix(in srgb, var(--hi) 55%, transparent); }
.notice.ok { background: var(--plus-soft); border-color: color-mix(in srgb, var(--plus) 30%, transparent); }
.notice.bad { background: var(--minus-soft); border-color: color-mix(in srgb, var(--minus) 30%, transparent); }
.notice .ic { margin-top: 2px; }
.notice p { margin: 0; }

.empty { text-align: center; padding: 28px 16px; color: var(--ink-3); }
.empty .ic { width: 40px; height: 40px; stroke-width: 1.5; margin-bottom: 6px; }

/* ---------- login ---------- */
.login { min-height: 100vh; display: grid; align-content: center; padding-block: 28px; }
.login-hero { display: grid; gap: 10px; justify-items: start; margin-bottom: 18px; }
.login-hero h1 { font-size: clamp(2.3rem, 9vw, 3.4rem); font-weight: 800; letter-spacing: .02em; line-height: .95; }
.login-hero h1 span { background: linear-gradient(transparent 58%, var(--hi) 58%, var(--hi) 88%, transparent 88%); padding: 0 4px; margin-left: -4px; }
.eqline { font-family: var(--f-num); font-size: .95rem; color: var(--ink-2); display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.eqline b { color: var(--ink); background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 2px 8px; }
.demo-box { border: 2px dashed color-mix(in srgb, var(--hi) 80%, var(--warn)); background: var(--hi-soft); border-radius: var(--r); padding: 14px; display: grid; gap: 10px; }

/* ---------- beranda ---------- */
.hello { display: grid; gap: 14px; grid-template-columns: 1fr auto; align-items: center; }
.hello h1 { font-size: clamp(1.45rem, 5.5vw, 1.9rem); }
.ledger { border: 1px solid var(--line); border-radius: var(--r); background: var(--surface); overflow: hidden; box-shadow: var(--shadow); }
.ledger-head { display: grid; grid-template-columns: 1fr auto; gap: 8px; padding: 14px 16px 10px; align-items: end; }
.ledger-rows { border-top: 2px solid var(--ink); }
.ledger-row { display: grid; grid-template-columns: 1fr auto; gap: 8px; padding: 7px 16px; border-bottom: 1px solid var(--line); font-size: .9rem; }
.ledger-row:last-child { border-bottom: 3px double var(--ink); }
.ledger-row .num { font-weight: 600; }
.ledger-saldo { font-family: var(--f-num); font-size: 2rem; font-weight: 600; line-height: 1; }
.ledger-saldo small { font-size: .9rem; color: var(--ink-3); margin-left: 4px; }

.misi-list { display: grid; gap: 10px; }
.misi-card {
  display: grid; grid-template-columns: auto 1fr auto; gap: 14px; align-items: center; text-align: left;
  padding: 14px; border-radius: var(--r); border: 1px solid var(--line); background: var(--surface); box-shadow: var(--shadow); width: 100%;
}
.misi-card:hover { border-color: var(--ink-3); }
.misi-card.locked { opacity: .62; box-shadow: none; }
.misi-no { font-family: var(--f-display); font-weight: 800; font-size: 1.6rem; color: var(--brand); width: 48px; height: 48px; border-radius: 12px; background: var(--brand-soft); display: grid; place-items: center; }
.misi-card.done .misi-no { background: var(--plus-soft); color: var(--plus); }
.misi-card h3 { font-size: 1.02rem; }
.misi-card p { margin: 2px 0 0; font-size: .85rem; color: var(--ink-2); }
.ring { width: 46px; height: 46px; }
.ring circle { fill: none; stroke-width: 5; }
.ring .tr { stroke: var(--surface-2); }
.ring .fg { stroke: var(--brand); stroke-linecap: round; transition: stroke-dashoffset .8s cubic-bezier(.2, .8, .2, 1); transform: rotate(-90deg); transform-origin: 50% 50%; }
.ring.done .fg { stroke: var(--plus); }
.ring text { font: 700 12px var(--f-num); fill: var(--ink); text-anchor: middle; dominant-baseline: central; }

.quick { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.quick button { text-align: left; border: 1px solid var(--line); background: var(--surface); border-radius: var(--r); padding: 14px; display: grid; gap: 6px; box-shadow: var(--shadow); }
.quick button .ic { width: 28px; height: 28px; color: var(--brand); }
.quick b { font-family: var(--f-display); font-size: 1.02rem; }

.badges { display: grid; grid-template-columns: repeat(auto-fill, minmax(92px, 1fr)); gap: 10px; }
.badge { display: grid; justify-items: center; gap: 6px; text-align: center; padding: 12px 6px; border-radius: 12px; background: var(--surface-2); border: 1px solid var(--line); }
.badge .medal { width: 48px; height: 48px; border-radius: 50%; display: grid; place-items: center; background: var(--surface); color: var(--ink-3); border: 2px dashed var(--line); }
.badge.got .medal { background: var(--hi); color: var(--hi-ink); border: 2px solid color-mix(in srgb, var(--hi) 50%, var(--warn)); box-shadow: 0 4px 0 color-mix(in srgb, var(--hi) 50%, var(--warn)); }
.badge b { font-size: .8rem; line-height: 1.2; }
.badge span { font-size: .7rem; color: var(--ink-3); line-height: 1.25; }
.badge:not(.got) b { color: var(--ink-3); }

/* ---------- materi ---------- */
.steps-dots { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
.steps-dots button { width: 30px; height: 30px; border-radius: 50%; border: 2px solid var(--line); background: var(--surface); font: 700 .78rem var(--f-num); color: var(--ink-3); display: grid; place-items: center; padding: 0; }
.steps-dots button.done { background: var(--plus-soft); border-color: var(--plus); color: var(--plus); }
.steps-dots button.cur { border-color: var(--brand); color: var(--brand); box-shadow: 0 0 0 3px var(--brand-soft); }
.steps-dots button.akt { width: auto; border-radius: 99px; padding: 0 12px; display: inline-flex; gap: 5px; font-family: var(--f-body); font-size: .8rem; }
.steps-dots button.akt .ic { width: 14px; height: 14px; }
.materi { font-size: 1.04rem; }
.materi h2 { font-size: clamp(1.35rem, 5vw, 1.7rem); margin-bottom: 12px; }
.materi p, .materi li, .materi dd { max-width: 65ch; }
.materi b { font-weight: 700; }
.materi .def { border-left: 5px solid var(--hi); background: var(--hi-soft); border-radius: 0 12px 12px 0; padding: 12px 14px; margin: 0 0 14px; }
.materi .def-k { font-size: .72rem; text-transform: uppercase; letter-spacing: .1em; font-weight: 700; color: var(--warn); }
.materi .def p { margin: 4px 0 0; }
.materi ol.steps { list-style: none; counter-reset: s; padding: 0; margin: 0 0 12px; display: grid; gap: 8px; }
.materi ol.steps li { counter-increment: s; display: grid; grid-template-columns: 34px 1fr; column-gap: 10px; padding: 10px 12px; border: 1px solid var(--line); border-radius: 12px; background: var(--surface); }
.materi ol.steps li::before { content: counter(s); grid-row: span 2; width: 30px; height: 30px; border-radius: 50%; background: var(--brand); color: var(--brand-ink); display: grid; place-items: center; font: 700 .9rem var(--f-num); }
.materi ol.steps span { font-size: .92rem; color: var(--ink-2); }
.materi ul.dots { padding-left: 1.2em; margin: 0 0 12px; }
.materi ul.dots li { margin-bottom: 4px; }
.materi .duo { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 10px; margin: 6px 0 12px; }
.materi .duo > div { border: 1px solid var(--line); border-radius: 12px; padding: 12px; background: var(--surface); display: grid; gap: 4px; }
.materi .duo > div:first-child { border-top: 4px solid var(--brand); }
.materi .duo > div:last-child { border-top: 4px solid var(--plus); }
.materi .duo span { font-size: .92rem; color: var(--ink-2); }
.materi dl.who { margin: 0 0 12px; display: grid; gap: 8px; }
.materi dl.who dt { font-weight: 700; font-family: var(--f-display); }
.materi dl.who dd { margin: 0 0 4px; padding-bottom: 8px; border-bottom: 1px dashed var(--line); color: var(--ink-2); }
.materi .note { font-size: .9rem; background: var(--surface-2); border-radius: 10px; padding: 10px 12px; }
.materi .eq { display: flex; align-items: center; justify-content: center; gap: 8px; flex-wrap: wrap; margin: 6px 0 14px; padding: 16px 10px; background: var(--surface); border: 2px solid var(--ink); border-radius: 14px; }
.materi .eq span { font-family: var(--f-display); font-weight: 800; font-size: 1.3rem; padding: 4px 12px; border-radius: 10px; background: var(--surface-2); }
.materi .eq span:first-child { background: var(--brand-soft); color: var(--brand); }
.materi .eq i { font-style: normal; font: 600 1.4rem var(--f-num); color: var(--ink-3); }
.materi .eq.eq-sm span { font-size: 1rem; }
.tbl-wrap { overflow-x: auto; border: 1px solid var(--line); border-radius: 12px; background: var(--surface); margin-bottom: 10px; }
table { border-collapse: collapse; width: 100%; font-size: .9rem; }
th, td { padding: 9px 10px; text-align: left; border-bottom: 1px solid var(--line); vertical-align: top; }
th { font-size: .74rem; text-transform: uppercase; letter-spacing: .06em; color: var(--ink-3); background: var(--surface-2); white-space: nowrap; }
tr:last-child td { border-bottom: 0; }
td.up { color: var(--plus); font-weight: 700; }
td.dn { color: var(--minus); font-weight: 700; }
td.r, th.r { text-align: right; }

.box { border: 1px solid var(--line); border-radius: 14px; padding: 14px; background: var(--surface); display: grid; gap: 10px; }
.box.think { border: 2px dashed color-mix(in srgb, var(--brand) 45%, var(--line)); background: color-mix(in srgb, var(--brand-soft) 45%, var(--surface)); }
.box-k { display: flex; gap: 8px; align-items: center; font-size: .75rem; letter-spacing: .09em; text-transform: uppercase; font-weight: 700; color: var(--brand); }
.reveal { border-left: 4px solid var(--plus); background: var(--plus-soft); padding: 10px 12px; border-radius: 0 10px 10px 0; }

.cek-item { display: grid; gap: 8px; padding: 12px 0; border-bottom: 1px dashed var(--line); }
.cek-item:last-child { border-bottom: 0; }
.opt-row { display: flex; gap: 8px; flex-wrap: wrap; }
.opt-row .btn { flex: 1 1 120px; }
.fb { font-size: .9rem; padding: 8px 10px; border-radius: 10px; display: flex; gap: 8px; align-items: flex-start; }
.fb.ok { background: var(--plus-soft); color: var(--ink); }
.fb.ok .ic { color: var(--plus); }
.fb.bad { background: var(--minus-soft); color: var(--ink); }
.fb.bad .ic { color: var(--minus); }
.btn.is-ok { background: var(--plus); color: #fff; border-color: var(--plus); }
.btn.is-ok[disabled], .btn.is-bad[disabled] { opacity: 1; }
.opt-row .btn.sec[disabled] { opacity: .45; }
.btn.is-bad { background: var(--minus); color: #fff; border-color: var(--minus); }

.flips { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 12px; }
.flip { perspective: 900px; border: 0; padding: 0; background: none; text-align: left; min-height: 150px; }
.flip-in { position: relative; width: 100%; height: 100%; min-height: 150px; transition: transform .55s cubic-bezier(.3, .7, .2, 1); transform-style: preserve-3d; }
.flip.on .flip-in { transform: rotateY(180deg); }
.flip-f, .flip-b { position: absolute; inset: 0; backface-visibility: hidden; -webkit-backface-visibility: hidden; border-radius: 14px; padding: 14px; display: grid; align-content: center; gap: 6px; border: 1px solid var(--line); }
.flip-f { background: var(--surface); box-shadow: var(--shadow); }
.flip-f b { font-family: var(--f-display); font-size: 1.08rem; }
.flip-f span { font-size: .78rem; color: var(--ink-3); display: flex; gap: 6px; align-items: center; }
.flip-b { background: var(--brand); color: var(--brand-ink); transform: rotateY(180deg); font-size: .9rem; line-height: 1.45; overflow-y: auto; align-content: start; }
.flip-b b { font-family: var(--f-display); }

.pager { display: flex; gap: 10px; justify-content: space-between; align-items: center; position: sticky; bottom: calc(var(--nav-h) + env(safe-area-inset-bottom, 0px) + 8px); z-index: 5; padding: 10px; background: color-mix(in srgb, var(--surface) 94%, transparent); border: 1px solid var(--line); border-radius: 16px; box-shadow: var(--shadow); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); }
.pager .btn { flex: 1; }
.no-nav .pager { bottom: calc(env(safe-area-inset-bottom, 0px) + 8px); }

/* ---------- aktivitas ---------- */
.akt-head { display: grid; gap: 6px; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chipbtn { border: 1.5px solid var(--line); background: var(--surface); border-radius: 12px; padding: 10px 14px; font-weight: 700; text-align: left; box-shadow: var(--shadow); min-height: 46px; }
.chipbtn:hover { border-color: var(--brand); }
.chipbtn.used { opacity: .35; pointer-events: none; box-shadow: none; }
.order-list { display: grid; gap: 6px; counter-reset: o; margin: 0; padding: 0; list-style: none; }
.order-list li { counter-increment: o; display: flex; gap: 10px; align-items: center; padding: 8px 12px; border-radius: 10px; background: var(--plus-soft); font-weight: 700; animation: pop .3s ease; }
.order-list li::before { content: counter(o); width: 26px; height: 26px; border-radius: 50%; background: var(--plus); color: #fff; display: grid; place-items: center; font: 700 .8rem var(--f-num); flex: none; }
.order-list li.slot { background: transparent; border: 1.5px dashed var(--line); color: var(--ink-3); font-weight: 400; animation: none; }
.order-list li.slot::before { background: var(--surface-2); color: var(--ink-3); }
@keyframes pop { from { transform: scale(.9); opacity: 0; } }
.shake { animation: shake .35s; }
@keyframes shake { 20%, 60% { transform: translateX(-6px); } 40%, 80% { transform: translateX(6px); } }

.sort-card { border: 1px solid var(--line); background: var(--nota); border-radius: 16px; padding: 22px 18px; text-align: center; font-family: var(--f-display); font-size: 1.25rem; font-weight: 700; box-shadow: var(--shadow); min-height: 110px; display: grid; place-items: center; }
.bins { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.bin { border: 2px dashed var(--line); border-radius: 14px; padding: 10px; min-height: 90px; display: grid; align-content: start; gap: 6px; }
.bin h4 { font-size: .9rem; display: flex; justify-content: space-between; }
.bin .mini { font-size: .8rem; padding: 4px 8px; border-radius: 8px; background: var(--surface-2); display: flex; gap: 6px; align-items: center; }
.bin .mini.bad { background: var(--minus-soft); }

.result-band { display: grid; grid-template-columns: auto 1fr; gap: 14px; align-items: center; padding: 16px; border-radius: var(--r); background: var(--plus-soft); border: 1px solid color-mix(in srgb, var(--plus) 30%, transparent); }
.result-band .big { font: 600 2.2rem/1 var(--f-num); }

/* ---------- nota & timbangan ---------- */
.nota {
  position: relative; background: var(--nota); border: 1px solid var(--line); border-bottom: 0; padding: 14px 16px 22px;
  font-family: var(--f-num); font-size: .9rem; box-shadow: var(--shadow);
  -webkit-mask: conic-gradient(from -45deg at bottom, #0000, #000 1deg 89deg, #0000 90deg) 50% / 14px 100%;
  mask: conic-gradient(from -45deg at bottom, #0000, #000 1deg 89deg, #0000 90deg) 50% / 14px 100%;
  border-radius: 12px 12px 0 0;
}
.nota-head { display: flex; justify-content: space-between; gap: 10px; border-bottom: 1.5px dashed var(--ink-3); padding-bottom: 8px; margin-bottom: 10px; font-size: .78rem; color: var(--ink-2); text-transform: uppercase; letter-spacing: .06em; }
.nota-body { font-family: var(--f-body); font-size: 1.02rem; line-height: 1.5; color: var(--ink); }
.nota-tag { display: inline-block; margin-top: 8px; font-size: .74rem; padding: 2px 8px; border: 1.5px solid var(--ink-3); border-radius: 6px; color: var(--ink-2); }

.scale-wrap { display: grid; justify-items: center; }
.scale { width: 100%; max-width: 380px; height: auto; overflow: visible; }
.scale .beam { transition: transform .9s cubic-bezier(.3, 1.4, .5, 1); transform-origin: 160px 52px; }
.scale .pan { transition: transform .9s cubic-bezier(.3, 1.4, .5, 1); }
.scale text { font-family: var(--f-num); font-weight: 600; fill: var(--ink); }
.scale .lbl { font-family: var(--f-display); font-weight: 800; font-size: 11px; fill: var(--ink-2); letter-spacing: .03em; }
.scale-status { font-weight: 700; display: inline-flex; gap: 6px; align-items: center; padding: 4px 12px; border-radius: 99px; }
.scale-status.ok { background: var(--plus-soft); color: var(--plus); }
.scale-status.tilt { background: var(--warn-soft); color: var(--warn); }

.predict { display: grid; gap: 8px; }
.predict-row { display: grid; grid-template-columns: 74px 1fr; gap: 10px; align-items: center; }
.predict-row > b { font-family: var(--f-display); }
.seg { display: grid; grid-template-columns: repeat(3, 1fr); border: 1.5px solid var(--line); border-radius: 12px; overflow: hidden; background: var(--surface); }
.seg button { border: 0; background: none; min-height: 44px; display: inline-flex; gap: 4px; align-items: center; justify-content: center; font-weight: 700; font-size: .88rem; color: var(--ink-2); }
.seg button + button { border-left: 1.5px solid var(--line); }
.seg button[aria-pressed="true"] { background: var(--brand); color: var(--brand-ink); }
.seg button.right { background: var(--plus); color: #fff; }
.seg button.wrong { background: var(--minus); color: #fff; }

.akun-tbl td.num, .akun-tbl th.num { text-align: right; white-space: nowrap; }
.akun-tbl .flash-up { animation: flashUp 1.4s ease; }
.akun-tbl .flash-dn { animation: flashDn 1.4s ease; }
@keyframes flashUp { 0%, 40% { background: var(--plus-soft); color: var(--plus); } }
@keyframes flashDn { 0%, 40% { background: var(--minus-soft); color: var(--minus); } }
.akun-tbl tfoot td { font-weight: 700; border-top: 2px solid var(--ink); }
.delta { font-size: .78rem; display: block; }
.delta.up { color: var(--plus); }
.delta.dn { color: var(--minus); }

/* ---------- kuis ---------- */
.quiz-top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 30; background: var(--surface); border-bottom: 1px solid var(--line); }
.quiz-top .wrap { display: flex; align-items: center; gap: 10px; min-height: 58px; }
.timer { display: inline-flex; align-items: center; gap: 6px; font: 600 1.05rem var(--f-num); padding: 6px 12px; border-radius: 10px; background: var(--surface-2); }
.timer.low { background: var(--minus-soft); color: var(--minus); animation: pulse 1s infinite; }
.qcard { display: grid; gap: 14px; }
.qtext { font-size: 1.12rem; font-weight: 700; line-height: 1.45; }
.qopts { display: grid; gap: 10px; }
.qopt { display: grid; grid-template-columns: 36px 1fr; gap: 10px; align-items: center; text-align: left; border: 1.5px solid var(--line); border-radius: 14px; padding: 12px; background: var(--surface); min-height: 56px; }
.qopt .k { width: 34px; height: 34px; border-radius: 10px; display: grid; place-items: center; font: 700 .95rem var(--f-num); background: var(--surface-2); color: var(--ink-2); }
.qopt[aria-pressed="true"] { border-color: var(--brand); background: var(--brand-soft); }
.qopt[aria-pressed="true"] .k { background: var(--brand); color: var(--brand-ink); }
.qopt.right { border-color: var(--plus); background: var(--plus-soft); }
.qopt.right .k { background: var(--plus); color: #fff; }
.qopt.wrong { border-color: var(--minus); background: var(--minus-soft); }
.qopt.wrong .k { background: var(--minus); color: #fff; }
.qgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(42px, 1fr)); gap: 8px; }
.qgrid button { height: 42px; border-radius: 10px; border: 1.5px solid var(--line); background: var(--surface); font: 600 .9rem var(--f-num); position: relative; }
.qgrid button.ans { background: var(--brand); color: var(--brand-ink); border-color: var(--brand); }
.qgrid button.cur { box-shadow: 0 0 0 3px var(--hi); }
.qgrid button.flag::after { content: ""; position: absolute; top: -4px; right: -4px; width: 12px; height: 12px; border-radius: 50%; background: var(--warn); border: 2px solid var(--surface); }
.angka { display: grid; grid-template-columns: auto 1fr; align-items: center; border: 1.5px solid var(--line); border-radius: 14px; overflow: hidden; background: var(--surface); }
.angka span { padding: 0 12px; font: 600 1.1rem var(--f-num); color: var(--ink-3); border-right: 1.5px solid var(--line); height: 100%; display: grid; place-items: center; background: var(--surface-2); }
.angka input { border: 0; min-height: 56px; padding: 0 14px; font: 600 1.25rem var(--f-num); background: transparent; width: 100%; min-width: 0; }
.angka input:focus { outline: none; }
.score-ring { width: 150px; height: 150px; }
.score-ring circle { fill: none; stroke-width: 12; }
.score-ring .tr { stroke: var(--surface-2); }
.score-ring .fg { stroke-linecap: round; transform: rotate(-90deg); transform-origin: 50% 50%; transition: stroke-dashoffset 1.2s cubic-bezier(.2, .8, .2, 1); }
.score-ring text { font: 600 40px var(--f-num); fill: var(--ink); text-anchor: middle; dominant-baseline: central; }
.stamp {
  display: inline-block; font-family: var(--f-display); font-weight: 800; letter-spacing: .14em; text-transform: uppercase;
  font-size: 1.15rem; padding: 6px 14px; border: 3.5px double currentColor; border-radius: 8px; transform: rotate(-7deg);
  animation: stamp .45s cubic-bezier(.2, 1.6, .4, 1) both .5s;
}
.stamp.ok { color: var(--plus); }
.stamp.bad { color: var(--minus); }
@keyframes stamp { from { transform: rotate(-7deg) scale(1.7); opacity: 0; } }
.tp-bars { display: grid; gap: 10px; }
.tp-bar { display: grid; gap: 4px; }
.tp-bar .row { font-size: .88rem; }

/* ---------- game ---------- */
.game-card { display: grid; grid-template-columns: auto 1fr; gap: 14px; align-items: start; }
.game-art { width: 64px; height: 64px; border-radius: 16px; display: grid; place-items: center; background: var(--brand); color: var(--brand-ink); }
.game-art .ic { width: 34px; height: 34px; }
.game-card:nth-child(2) .game-art { background: var(--hi); color: var(--hi-ink); }
.game-card:nth-child(3) .game-art { background: var(--plus); color: #fff; }
.hud { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; justify-content: space-between; }
.hud .pill { font-size: .85rem; padding: 6px 12px; }
.timebar { height: 8px; border-radius: 99px; background: var(--surface-2); overflow: hidden; }
.timebar i { display: block; height: 100%; background: var(--plus); transition: width .25s linear, background .3s; }
.timebar i.low { background: var(--minus); }
.kat-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
.kat-grid button:last-child { grid-column: span 2; }
.kat-grid .btn { min-height: 58px; font-size: 1.02rem; }
.akun-card { min-height: 140px; display: grid; place-items: center; text-align: center; border-radius: 18px; background: var(--nota); border: 1px solid var(--line); box-shadow: var(--shadow); padding: 18px; font-family: var(--f-display); font-weight: 800; font-size: clamp(1.4rem, 6vw, 1.9rem); }
.akun-card.ok { animation: okpulse .4s; }
.akun-card.bad { animation: shake .35s; }
@keyframes okpulse { 50% { transform: scale(1.04); box-shadow: 0 0 0 6px var(--plus-soft); } }
.combo { font: 700 .9rem var(--f-num); color: var(--warn); }
.akfb { min-height: 44px; display: flex; align-items: center; justify-content: center; gap: 8px; text-align: center; font-size: .92rem; border-radius: 12px; padding: 8px 12px; }
.akfb.ok { background: var(--plus-soft); color: var(--plus); font-weight: 700; }
.akfb.bad { background: var(--minus-soft); color: var(--ink); }
.login .tamu { flex-direction: column; gap: 2px; }
.login .tamu small { font-weight: 400; color: var(--ink-3); font-size: .8rem; }
.clues { display: grid; gap: 8px; counter-reset: c; }
.clue { display: grid; grid-template-columns: auto 1fr; gap: 10px; padding: 10px 12px; border-radius: 12px; background: var(--surface); border: 1px solid var(--line); animation: pop .3s ease; }
.clue::before { counter-increment: c; content: counter(c); width: 26px; height: 26px; border-radius: 50%; background: var(--ink); color: var(--surface); display: grid; place-items: center; font: 700 .8rem var(--f-num); }
.floaty { position: fixed; z-index: 90; pointer-events: none; font: 700 1rem var(--f-num); color: var(--plus); animation: floaty 1s ease forwards; }
.floaty.bad { color: var(--minus); }
@keyframes floaty { to { transform: translateY(-46px); opacity: 0; } }

/* ---------- lapisan: modal, toast, konfeti ---------- */
.overlay { position: fixed; inset: 0; z-index: 80; background: rgba(8, 14, 30, .5); display: grid; align-items: end; justify-items: center; padding: 16px; padding-bottom: calc(16px + env(safe-area-inset-bottom, 0px)); animation: fade .2s; }
@media (min-width: 640px) { .overlay { align-items: center; } }
.sheet { width: 100%; max-width: 520px; max-height: 88vh; overflow-y: auto; background: var(--surface); border-radius: 20px; padding: 20px; display: flex; flex-direction: column; gap: 14px; box-shadow: 0 30px 60px -20px rgba(0, 0, 0, .5); animation: up .28s cubic-bezier(.2, .9, .3, 1.1); }
.sheet > * { flex-shrink: 0; }
.sheet h2 { font-size: 1.3rem; }
@keyframes fade { from { opacity: 0; } }
@keyframes up { from { transform: translateY(30px); opacity: 0; } }
.celebrate { text-align: center; justify-items: center; }
.celebrate .medal-big { width: 96px; height: 96px; border-radius: 50%; background: var(--hi); color: var(--hi-ink); display: grid; place-items: center; box-shadow: 0 6px 0 color-mix(in srgb, var(--hi) 50%, var(--warn)); animation: stamp .5s cubic-bezier(.2, 1.6, .4, 1) both; }
.celebrate .medal-big .ic { width: 48px; height: 48px; }
#toasts { position: fixed; z-index: 95; left: 0; right: 0; top: calc(env(safe-area-inset-top, 0px) + 66px); display: grid; justify-items: center; gap: 8px; pointer-events: none; padding-inline: 16px; }
.toast { pointer-events: auto; max-width: 480px; display: flex; gap: 10px; align-items: center; padding: 11px 16px; border-radius: 14px; background: var(--ink); color: var(--bg); font-weight: 700; font-size: .92rem; box-shadow: 0 14px 30px -12px rgba(0, 0, 0, .5); animation: up .25s ease; }
.toast.ok .ic { color: var(--plus); }
.toast.bad .ic { color: var(--minus); }
.toast.xp .ic { color: var(--hi); }
.toast.out { opacity: 0; transform: translateY(-10px); transition: .3s; }
#confetti { position: fixed; inset: 0; pointer-events: none; z-index: 99; width: 100%; height: 100%; }
.loading { display: grid; place-items: center; min-height: 60vh; gap: 12px; color: var(--ink-3); }
.spin { width: 34px; height: 34px; border-radius: 50%; border: 4px solid var(--line); border-top-color: var(--brand); animation: spin .8s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
.btn .spin { width: 18px; height: 18px; border-width: 3px; border-color: rgba(255, 255, 255, .35); border-top-color: currentColor; }

/* ---------- guru ---------- */
.kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; }
.kpi { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 14px; display: grid; gap: 2px; }
.kpi b { font: 600 1.75rem/1.1 var(--f-num); }
.kpi span { font-size: .8rem; color: var(--ink-3); }
.kpi small { font-size: .78rem; color: var(--ink-2); }
.mini-kpis { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.mini-kpis .kpi { padding: 10px; }
.mini-kpis .kpi b { font-size: 1.35rem; }
.mini-kpis .kpi span, .mini-kpis .kpi small { font-size: .72rem; }
.hbar { display: grid; grid-template-columns: minmax(80px, 140px) 1fr 52px; gap: 10px; align-items: center; font-size: .88rem; }
.hbar .bar { height: 14px; }
.dist { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; align-items: end; height: 150px; padding-top: 10px; }
.dist div { display: grid; gap: 4px; justify-items: center; align-self: end; }
.dist i { width: 100%; max-width: 64px; border-radius: 8px 8px 2px 2px; background: var(--brand); min-height: 4px; transition: height .6s; }
.dist div:first-child i { background: var(--minus); }
.dist div:nth-child(2) i { background: var(--warn); }
.dist div:nth-child(4) i { background: var(--plus); }
.dist b { font: 600 .9rem var(--f-num); }
.dist span { font-size: .72rem; color: var(--ink-3); text-align: center; }
.stu-tbl td { vertical-align: middle; }
.stu-tbl tr.click { cursor: pointer; }
.stu-tbl tr.click:hover td { background: var(--surface-2); }
.mdots { display: inline-flex; gap: 3px; }
.mdots i { width: 16px; height: 16px; border-radius: 5px; background: var(--surface-2); border: 1px solid var(--line); position: relative; overflow: hidden; }
.mdots i b { position: absolute; left: 0; bottom: 0; right: 0; background: var(--brand); }
.mdots i.full { background: var(--plus); border-color: var(--plus); }
.mdots i.full b { display: none; }
.toolbar { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.toolbar .input { width: auto; flex: 1 1 180px; min-height: 42px; padding: 8px 12px; }
.toolbar select.input { flex: 0 1 160px; }
.cred { font-family: var(--f-num); background: var(--surface-2); border-radius: 8px; padding: 2px 8px; }
.cred-list { display: grid; gap: 8px; max-height: 50vh; overflow-y: auto; }
.cred-card { border: 1.5px dashed var(--ink-3); border-radius: 12px; padding: 10px 12px; display: grid; gap: 2px; font-size: .9rem; background: var(--nota); }
.item-q { display: grid; gap: 6px; padding: 12px 0; border-bottom: 1px solid var(--line); }
.item-q:last-child { border-bottom: 0; }
.dist-opt { display: grid; grid-template-columns: 22px 1fr 44px; gap: 8px; align-items: center; font-size: .82rem; }
.dist-opt .bar { height: 8px; }
.dist-opt.key { font-weight: 700; }
.dist-opt.key .bar > i { background: var(--plus); }
.refl { display: grid; gap: 8px; padding: 14px 0; border-bottom: 1px solid var(--line); }
.refl:last-child { border-bottom: 0; }
.refl q { display: block; quotes: none; }
.refl .lbl { font-size: .74rem; text-transform: uppercase; letter-spacing: .07em; color: var(--ink-3); font-weight: 700; }

var SB = {
  bool: function (v) { return v === true || /^(true|ya|y|1|benar|on)$/i.test(String(v == null ? '' : v).trim()); },
  num: function (v, d) { var n = Number(String(v == null ? '' : v).replace(',', '.')); return isFinite(n) && String(v).trim() !== '' ? n : (d === undefined ? 0 : d); },
  clamp: function (n, a, b) { return Math.max(a, Math.min(b, n)); },
  uniqInts: function (arr, max) {
    var seen = {}, out = [];
    (arr || []).forEach(function (x) { var n = Math.floor(Number(x)); if (isFinite(n) && n >= 0 && n < max && !seen[n]) { seen[n] = 1; out.push(n); } });
    return out;
  },

  /* Pengaturan mentah (objek kunci→teks) menjadi objek bertipe */
  parseSettings: function (raw) {
    raw = raw || {};
    var s = {};
    SETTINGS_DEF.forEach(function (d) { s[d[0]] = (raw[d[0]] === undefined || raw[d[0]] === null) ? d[1] : raw[d[0]]; });

      nama_guru: String(s.nama_guru || ''),
      sekolah: String(s.sekolah || ''),
      kktp: SB.clamp(SB.num(s.kktp, 75), 0, 100),

      kuis_jumlah: SB.clamp(Math.round(SB.num(s.kuis_jumlah, 20)), 4, 40),

      game_dibuka: SB.bool(s.game_dibuka),
      peringkat: SB.bool(s.peringkat),
      tamu: SB.bool(s.tamu),
      pengumuman: String(s.pengumuman || ''),
      fokus: /^(m[1-4]|kuis|game)$/.test(String(s.fokus)) ? String(s.fokus) : '',
      versi: Math.round(SB.num(s.versi, 1))

  V['g-nilai'] = function () {
    return shell('g-nilai', function () {
      var s = S.settings, sw = siswaF().slice().sort(function (a, b) { return (a.kelas || '').localeCompare(b.kelas || '') || a.nama.localeCompare(b.nama); });
      var att = kuisF().slice().sort(function (a, b) { return String(b.waktu).localeCompare(String(a.waktu)); });
      var html = '<div class="toolbar"><button class="btn sm" data-act="gRekap">' + icon('copy') + ' Salin rekap untuk Excel</button>' + (S.dash.info && S.dash.info.sheetUrl ? '<a class="btn sec sm" href="' + esc(S.dash.info.sheetUrl) + '" target="_blank" rel="noopener">' + icon('sheet') + ' Buka Google Sheet</a>' : '') + '<span class="small muted">Rekap memakai nilai terbaik setiap siswa. KKTP ' + s.kktp + '.</span></div>';
      html += '<section class="card" style="padding:0;overflow:hidden"><div class="tbl-wrap" style="border:0;margin:0;border-radius:0"><table><thead><tr><th>No</th><th>Nama</th><th>Kelas</th><th class="r">Nilai</th><th class="r">Coba</th><th>Status</th><th class="r">Misi</th><th class="r">XP</th></tr></thead><tbody>' +
        sw.map(function (x, i) {
          var st = !x.kuis_percobaan ? '<span class="pill">Belum kuis</span>' : x.kuis_terbaik >= s.kktp ? '<span class="pill ok">Tuntas</span>' : '<span class="pill bad">Remedial</span>';
          return '<tr><td class="num">' + (i + 1) + '</td><td><b>' + esc(x.nama) + '</b></td><td class="small">' + esc(x.kelas) + '</td><td class="r num"><b>' + (x.kuis_percobaan ? x.kuis_terbaik : '–') + '</b></td><td class="r num">' + x.kuis_percobaan + '</td><td>' + st + '</td><td class="r num">' + rataMisi(x) + '%</td><td class="r num">' + fmtN(x.xp) + '</td></tr>';
        }).join('') + '</tbody></table></div></section>';
      html += '<div class="sec-title"><h2>Riwayat pengerjaan</h2><span class="small muted">' + att.length + ' percobaan</span></div>';
      html += att.length ? '<section class="card" style="padding:0;overflow:hidden"><div class="tbl-wrap" style="border:0;margin:0;border-radius:0"><table><thead><tr><th>Waktu</th><th>Nama</th><th>Ke-</th><th class="r">Benar</th><th class="r">Nilai</th><th class="r">Durasi</th></tr></thead><tbody>' +
        att.slice(0, 200).map(function (r) { return '<tr><td class="small">' + A.tgl(r.waktu) + '</td><td>' + esc(r.nama) + '<div class="tiny muted">' + esc(r.kelas) + '</div></td><td class="num">' + r.percobaan + '</td><td class="r num">' + r.benar + '/' + r.jumlah + '</td><td class="r num"><b style="color:' + (r.nilai >= s.kktp ? 'var(--plus)' : 'var(--minus)') + '">' + r.nilai + '</b></td><td class="r num small">' + Math.floor(r.durasi_detik / 60) + 'm ' + (r.durasi_detik % 60) + 'd</td></tr>'; }).join('') + '</tbody></table></div></section>' : '<div class="card empty small">Belum ada pengerjaan kuis.</div>';
      return html;
    });
  };
  ACT.gRekap = function () {
    var s = S.settings, sw = siswaF().slice().sort(function (a, b) { return (a.kelas || '').localeCompare(b.kelas || '') || a.nama.localeCompare(b.nama); });
    var rows = [['No', 'Nama', 'Kelas', 'Username', 'Nilai Terbaik', 'Percobaan', 'Status', 'Misi 1 (%)', 'Misi 2 (%)', 'Misi 3 (%)', 'Misi 4 (%)', 'XP', 'Lencana']];
    sw.forEach(function (x, i) { rows.push([i + 1, x.nama, x.kelas, x.username, x.kuis_percobaan ? x.kuis_terbaik : '', x.kuis_percobaan, !x.kuis_percobaan ? 'Belum kuis' : x.kuis_terbaik >= s.kktp ? 'Tuntas' : 'Remedial'].concat(x.misi, [x.xp, x.lencana])); });
    A.copyText(rows.map(function (r) { return r.join('\t'); }).join('\n')).then(function () { A.toast('Rekap tersalin. Tempel di Excel atau Google Sheets.'); }, function () { A.toast('Tidak bisa menyalin otomatis di peramban ini.', 'bad'); });
  };

  /* ---------- Analisis soal ---------- */
  V['g-soal'] = function () {
    return shell('g-soal', function () {
      var att = kuisF();
      var stat = {};
      (S.dash.soal || []).forEach(function (q) { stat[q.id] = { q: q, n: 0, b: 0, pilih: {} }; });
      att.forEach(function (r) { (r.rincian || []).forEach(function (x) { var s = stat[x.id]; if (!s) return; s.n++; if (x.b) s.b++; var k = String(x.j); s.pilih[k] = (s.pilih[k] || 0) + 1; }); });
      var list = Object.keys(stat).map(function (k) { return stat[k]; }).filter(function (s) { return s.n; }).sort(function (a, b) { return a.b / a.n - b.b / b.n; });
      if (!list.length) return '<div class="card empty">' + icon('search') + '<p>Analisis muncul setelah siswa mengerjakan kuis.</p></div>';
      var sukar = list.filter(function (s) { return s.b / s.n <= 0.3; }).length, sedang = list.filter(function (s) { var p = s.b / s.n; return p > 0.3 && p <= 0.7; }).length, mudah = list.length - sukar - sedang;
      var html = '<div class="kpis">' + kpi(att.length, 'Lembar jawaban dianalisis', '') + kpi(sukar, 'Soal sukar', 'proporsi benar ≤ 0,30') + kpi(sedang, 'Soal sedang', '0,31–0,70') + kpi(mudah, 'Soal mudah', '> 0,70') + '</div>' +
        '<div class="notice">' + icon('info') + '<p class="small">Soal diurutkan dari yang paling banyak dijawab salah. Perhatikan <b>pengecoh terbanyak</b>: pilihan salah yang paling sering dipilih biasanya menunjukkan miskonsepsi yang perlu diluruskan di kelas.</p></div>';
      html += '<section class="card">' + list.map(function (s) {
        var p = s.b / s.n, pc = Math.round(p * 100), q = s.q;
        var kat = p <= 0.3 ? '<span class="pill bad">Sukar</span>' : p <= 0.7 ? '<span class="pill warn">Sedang</span>' : '<span class="pill ok">Mudah</span>';
        var detail;
        if (q.t === 'angka') {
          var salah = Object.keys(s.pilih).filter(function (k) { return Number(k) !== q.a; }).sort(function (a, b) { return s.pilih[b] - s.pilih[a]; }).slice(0, 3);
          detail = '<div class="small">Kunci: <b class="num">' + A.rp(q.a) + '</b>' + (salah.length ? ' · Jawaban salah terbanyak: ' + salah.map(function (k) { return '<span class="cred">' + (k === '' || k === '-1' ? 'kosong' : A.rp(Number(k))) + '</span> (' + s.pilih[k] + ')'; }).join(', ') : '') + '</div>';
        } else {
          var maxSalah = -1, idxSalah = -1;
          q.o.forEach(function (o, j) { if (j !== q.a && (s.pilih[j] || 0) > maxSalah) { maxSalah = s.pilih[j] || 0; idxSalah = j; } });
          detail = '<div class="stack" style="gap:4px">' + q.o.map(function (o, j) {
            var c = s.pilih[j] || 0, w = Math.round(c / s.n * 100);
            return '<div class="dist-opt ' + (j === q.a ? 'key' : '') + '"><span class="num">' + 'ABCD'[j] + '</span><div><div class="small" style="line-height:1.3">' + esc(o) + (j === q.a ? ' ' + icon('check') : '') + (j === idxSalah && maxSalah > 0 ? ' <span class="pill warn" style="font-size:.68rem">pengecoh terbanyak</span>' : '') + '</div><div class="bar"><i style="width:' + w + '%;' + (j !== q.a ? 'background:var(--ink-3)' : '') + '"></i></div></div><span class="num small r">' + c + '</span></div>';
          }).join('') + (s.pilih['-1'] ? '<span class="tiny muted">Tidak dijawab: ' + s.pilih['-1'] + '</span>' : '') + '</div>';
        }
        return '<div class="item-q"><div class="row between"><span class="row" style="gap:6px"><span class="pill info">TP ' + misiNo(q.m) + '</span>' + kat + '</span><span class="small"><b class="num">' + pc + '%</b> benar · ' + s.n + ' jawaban</span></div><div class="bar ' + (p > 0.7 ? 'ok' : '') + '"><i style="width:' + pc + '%;' + (p <= 0.7 ? 'background:' + (p <= 0.3 ? 'var(--minus)' : 'var(--warn)') : '') + '"></i></div><div><b>' + esc(q.q) + '</b></div>' + detail + '</div>';
      }).join('') + '</section>';
      return html;
    });
  };

  /* ---------- Refleksi ---------- */
  V['g-refleksi'] = function () {
    return shell('g-refleksi', function () {
      var all = reflF().slice().sort(function (a, b) { return String(b.waktu).localeCompare(String(a.waktu)); });
      var list = S.gf.reflFilter === 'belum' ? all.filter(function (r) { return !r.balasan; }) : all;
      var html = '<div class="toolbar"><label class="sr" for="gf-refl">Tampilkan</label><select class="input" id="gf-refl" data-gf="refl"><option value="semua">Semua refleksi (' + all.length + ')</option><option value="belum" ' + (S.gf.reflFilter === 'belum' ? 'selected' : '') + '>Belum dibalas (' + all.filter(function (r) { return !r.balasan; }).length + ')</option></select></div>';
      if (!list.length) return html + '<div class="card empty">' + icon('message') + '<p>' + (all.length ? 'Semua refleksi sudah dibalas.' : 'Belum ada refleksi dari siswa.') + '</p></div>';
      html += '<section class="card">' + list.map(function (r) {
        return '<div class="refl"><div class="row between nowrap"><span class="row nowrap" style="gap:10px;min-width:0">' + A.moodFace(r.perasaan) + '<span style="min-width:0"><b>' + esc(r.nama) + '</b><span class="tiny muted" style="display:block">' + esc(r.kelas) + ' · ' + A.tgl(r.waktu) + ' · ' + A.MOOD_LABEL[r.perasaan] + '</span></span></span>' + (r.balasan ? '<span class="pill ok">Dibalas</span>' : '<span class="pill warn">Baru</span>') + '</div>' +
          (r.paham ? '<div><span class="lbl">Sudah paham</span><q>' + esc(r.paham) + '</q></div>' : '') + (r.bingung ? '<div><span class="lbl">Masih bingung</span><q>' + esc(r.bingung) + '</q></div>' : '') + (r.pertanyaan ? '<div><span class="lbl">Pertanyaan</span><q>' + esc(r.pertanyaan) + '</q></div>' : '') +
          '<form class="stack" style="gap:6px" data-form="gBalas"><input type="hidden" name="id" value="' + esc(r.id) + '"><label class="sr" for="bl-' + esc(r.id) + '">Balasan</label><textarea class="input" id="bl-' + esc(r.id) + '" name="balasan" style="min-height:64px" placeholder="Tulis balasan untuk ' + esc(A.firstName(r.nama)) + '…">' + esc(r.balasan) + '</textarea><button class="btn sm" type="submit" style="justify-self:start">' + icon('send') + (r.balasan ? ' Perbarui balasan' : ' Kirim balasan') + '</button></form></div>';
      }).join('') + '</section>';
      return html;
    });
  };
  ACT['form:gBalas'] = function (f) {
    var btn = f.querySelector('[type=submit]'); A.busy(btn, true, 'Mengirim…');
    A.Api.call('balasRefleksi', { id: f.id.value, balasan: f.balasan.value.trim() }).then(function () {
      A.toast('Balasan terkirim. Siswa melihatnya di menu Refleksi.');
      var r = S.dash.refleksi.filter(function (x) { return x.id === f.id.value; })[0]; if (r) r.balasan = f.balasan.value.trim();
      btn.blur(); A.busy(btn, false); var y = window.scrollY; A.render(); window.scrollTo(0, y);
    }, function (e) { A.busy(btn, false); A.toast(e.message, 'bad'); });
  };

  return { muat: muat, autoRefresh: autoRefresh };
})(App);

;
App.boot();
</script>
</body>
</html>
